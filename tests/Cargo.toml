[package]
name = "fluent-integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
assert_cmd = "2.0"
predicates = "3.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[test]]
name = "integration"
path = "integration/command_integration_tests.rs"

[[test]]
name = "cli_functional_tests"
path = "functional_tests/cli_functional_tests.rs"

[[test]]
name = "comprehensive_option_tests"
path = "functional_tests/comprehensive_option_tests.rs"

[[test]]
name = "simple_test"
path = "functional_tests/simple_test.rs"

[[test]]
name = "e2e_cli_tests"
path = "e2e_cli_tests.rs"

[[test]]
name = "exit_code_tests"
path = "exit_code_tests.rs"