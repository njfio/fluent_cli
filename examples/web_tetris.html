        // Game constants
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;

        // Piece class to handle tetromino logic
        class Piece {
            constructor(type, x = 3, y = 0) {
                this.type = type;
                this.shape = TETROMINOES[type].shape.map(row => [...row]);
                this.color = TETROMINOES[type].color;
                this.x = x;
                this.y = y;
            }

            // Rotate piece clockwise
            rotate() {
                const newShape = [];
                const size = this.shape.length;
                
                for (let i = 0; i < size; i++) {
                    newShape[i] = [];
                    for (let j = 0; j < size; j++) {
                        newShape[i][j] = this.shape[size - 1 - j][i];
                    }
                }
                
                return new Piece(this.type, this.x, this.y);
            }

            // Get all filled positions of the piece
            getFilledPositions() {
                const positions = [];
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            positions.push({
                                x: this.x + col,
                                y: this.y + row
                            });
                        }
                    }
                }
                return positions;
            }

            // Create a copy of the piece
            copy() {
                const newPiece = new Piece(this.type, this.x, this.y);
                newPiece.shape = this.shape.map(row => [...row]);
                return newPiece;
            }
        }

        // Board class to handle game board logic

            constructor() {

                this.ctx = this.canvas.getContext('2d');

                const positions = piece.getFilledPositions();

                    // Check boundaries
                    if (pos.x < 0 || pos.x >= BOARD_WIDTH || pos.y >= BOARD_HEIGHT) {
                        return false;
                    }
                    
                    // Check collision with existing blocks (ignore negative y for spawning)
                    if (pos.y >= 0 && this.grid[pos.y][pos.x] !== null) {
                        return false;
                    }
                }
                
                return true;

                    }
                }

                        this.grid.unshift(Array(BOARD_WIDTH).fill(null));
                        linesCleared++;
                        row++; // Check the same row again

                }
                
                return linesCleared;

            render(currentPiece = null) {
                // Clear canvas
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid lines

                    this.ctx.beginPath();
                    this.ctx.moveTo(x * CELL_SIZE, 0);

                    this.ctx.stroke();

            }
        }
